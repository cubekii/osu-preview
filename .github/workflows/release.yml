name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Chrome and Firefox
        run: npm run build:all

      - name: Upload Chrome zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: osu-preview-chrome.zip

      - name: Upload Firefox zip to release
        uses: softprops/action-gh-release@v2
        with:
          files: osu-preview-firefox.zip
